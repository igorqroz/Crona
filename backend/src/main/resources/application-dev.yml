# Perfil "dev": só na sua máquina.
# É o perfil padrão (ver spring.profiles.default em application.yml).
# Em produção, o perfil é outro e esta configuração não é carregada.

spring:
  flyway:
    # Além das migrações normais, roda os dados de desenvolvimento (db/dev).
    locations: classpath:db/migration,classpath:db/dev

crona:
  jwt:
    # Segredo SÓ de desenvolvimento. Em produção ele vem da variável de ambiente JWT_SEGREDO,
    # é diferente deste e nunca fica no repositório: quem tem o segredo consegue fabricar tokens.
    segredo: "segredo-de-desenvolvimento-do-crona-nao-use-em-producao"
