<aside class="lateral">
  <div class="marca">
    <crona-logo />
    <crona-sino />
  </div>

  <nav aria-label="Principal">
    <ng-template #itemDoMenu let-item>
      <a class="link" [routerLink]="item.rota" routerLinkActive="ativo" ariaCurrentWhenActive="page">
        <crona-icone [nome]="item.icone" />
        <span>{{ item.texto }}</span>
        @if (item.contador && item.contador() > 0) {
          <span class="contador" [attr.aria-label]="item.contador() + ' esperando você'">{{ item.contador() }}</span>
        }
      </a>
    </ng-template>

    <div class="grupo">
      @for (item of menu; track item.rota) {
        <ng-container *ngTemplateOutlet="itemDoMenu; context: { $implicit: item }" />
      }
    </div>

    @if (menuDeGestao().length > 0) {
      <div class="grupo">
        <span class="titulo-do-grupo">Gestão</span>
        @for (item of menuDeGestao(); track item.rota) {
          <ng-container *ngTemplateOutlet="itemDoMenu; context: { $implicit: item }" />
        }
      </div>
    }
  </nav>

  @if (usuario(); as eu) {
    <div class="rodape">
      <div class="eu">
        <crona-avatar [nome]="eu.nome" [tamanho]="34" />
        <div class="eu-texto">
          <span class="eu-nome">{{ eu.nome }}</span>
          <span class="eu-perfil">{{ perfil() }}</span>
        </div>
      </div>
      <button class="botao sair" type="button" (click)="sair()">
        <crona-icone nome="sair" [tamanho]="17" />
        <span>Sair</span>
      </button>
    </div>
  }
</aside>

<main class="conteudo">
  <router-outlet />
</main>
